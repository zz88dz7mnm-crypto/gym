<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyOS — IDE de Python</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/darcula.min.css">
<style>
:root{
  --bg:#1e1f22; --bg-2:#2b2d30; --bg-3:#393b40; --panel:#1e1f22;
  --border:#393b40; --fg:#dfe1e5; --fg-dim:#9da0a8;
  --accent:#3574f0; --green:#5fad65; --red:#e55765; --yellow:#d5b778;
  --orange:#cf8e6d; --purple:#c77dbb; --topbar:#2b2d30;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13px;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- barra superior ---------- */
.topbar{
  height:44px;flex:0 0 44px;background:var(--topbar);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 12px;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px}
.logo .mark{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;
  background:linear-gradient(135deg,#3574f0,#5fad65);color:#fff;
}
.logo small{color:var(--fg-dim);font-weight:500;letter-spacing:0}
.spacer{flex:1}
.btn{
  background:var(--bg-3);color:var(--fg);border:1px solid var(--border);border-radius:6px;
  padding:6px 12px;font-size:12px;font-family:var(--ui);cursor:pointer;display:flex;
  align-items:center;gap:6px;transition:background .12s,border-color .12s;
}
.btn:hover{background:#4a4d52}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.run{background:var(--green);border-color:var(--green);color:#0f1c11;font-weight:600}
.btn.run:hover{background:#6cbf72}
.btn.stop{background:#4a3033;border-color:#6b3b40;color:#ffb3ba}
.btn.icon{padding:6px 9px}

/* ---------- layout ---------- */
.main{flex:1;display:flex;min-height:0}
.sidebar{
  width:210px;flex:0 0 210px;background:var(--bg-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
}
.side-head{
  padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--fg-dim);display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.side-head button{
  background:none;border:none;color:var(--fg-dim);cursor:pointer;font-size:15px;line-height:1;padding:0 4px;
}
.side-head button:hover{color:var(--fg)}
.files{flex:1;overflow-y:auto;padding:6px 0}
.file{
  padding:5px 12px;display:flex;align-items:center;gap:7px;cursor:pointer;
  font-family:var(--mono);font-size:12px;color:var(--fg);border-left:2px solid transparent;
}
.file:hover{background:#2f3134}
.file.active{background:#2f3f5c;border-left-color:var(--accent)}
.file .py{color:var(--yellow);font-size:11px}
.file .del{margin-left:auto;color:transparent;font-size:14px;line-height:1}
.file:hover .del{color:var(--fg-dim)}
.file .del:hover{color:var(--red)}
.side-foot{padding:8px 12px;border-top:1px solid var(--border);color:var(--fg-dim);font-size:11px}

.editorwrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{
  height:34px;flex:0 0 34px;background:var(--bg-2);border-bottom:1px solid var(--border);
  display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:0 14px;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;
  font-family:var(--mono);font-size:12px;color:var(--fg-dim);border-right:1px solid var(--border);
}
.tab.active{background:var(--bg);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.tab .x{color:transparent;font-size:13px}
.tab:hover .x{color:var(--fg-dim)}
.tab .x:hover{color:var(--red)}

.editor{flex:1;min-height:0;position:relative}
.CodeMirror{height:100%;font-family:var(--mono);font-size:13.5px;line-height:1.55;background:var(--bg)}
.CodeMirror-gutters{background:var(--bg);border-right:1px solid var(--border)}
.CodeMirror-linenumber{color:#4e5157}
.CodeMirror-cursor{border-left:2px solid #cdd0d5}
.CodeMirror-selected{background:#214283 !important}
.CodeMirror-activeline-background{background:#26282e}

/* ---------- consola ---------- */
.console{
  height:230px;flex:0 0 230px;background:var(--panel);border-top:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
}
.console-head{
  height:30px;flex:0 0 30px;display:flex;align-items:center;gap:14px;padding:0 12px;
  background:var(--bg-2);border-bottom:1px solid var(--border);font-size:11px;
  text-transform:uppercase;letter-spacing:.8px;color:var(--fg-dim);
}
.console-head .tabbtn{cursor:pointer;padding:0 2px;border-bottom:2px solid transparent;line-height:28px}
.console-head .tabbtn.active{color:var(--fg);border-bottom-color:var(--accent)}
.console-head .status{margin-left:auto;text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--yellow)}
.dot.ready{background:var(--green)}
.dot.busy{background:var(--accent);animation:pulse .9s infinite}
@keyframes pulse{50%{opacity:.3}}
.out{
  flex:1;overflow-y:auto;padding:10px 14px;font-family:var(--mono);font-size:12.5px;
  line-height:1.6;white-space:pre-wrap;word-break:break-word;
}
.out .err{color:var(--red)}
.out .sys{color:var(--fg-dim)}
.out .ok{color:var(--green)}
.out .in{color:var(--purple)}
.replbar{
  display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:6px 12px;
  font-family:var(--mono);font-size:12.5px;
}
.replbar span{color:var(--green)}
.replbar input{
  flex:1;background:none;border:none;outline:none;color:var(--fg);font-family:var(--mono);font-size:12.5px;
}
.hidden{display:none !important}

/* ---------- móvil ---------- */
.mobtoggle{display:none}
@media (max-width:820px){
  .sidebar{position:absolute;z-index:20;top:44px;bottom:0;left:0;transform:translateX(-100%);transition:transform .18s}
  .sidebar.open{transform:none}
  .mobtoggle{display:flex}
  .console{height:190px;flex-basis:190px}
  .logo small{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="btn icon mobtoggle" id="menuBtn" title="Archivos">☰</button>
  <div class="logo"><span class="mark">Py</span>PyOS <small>· IDE de Python</small></div>
  <div class="spacer"></div>
  <button class="btn run" id="runBtn" disabled>▶ Ejecutar</button>
  <button class="btn" id="clearBtn">Limpiar</button>
  <button class="btn icon" id="dlBtn" title="Descargar archivo">⤓</button>
</div>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">Proyecto <button id="newBtn" title="Nuevo archivo">＋</button></div>
    <div class="files" id="fileList"></div>
    <div class="side-foot">Se guarda solo en tu navegador</div>
  </aside>

  <div class="editorwrap">
    <div class="tabs" id="tabs"></div>
    <div class="editor"><textarea id="code"></textarea></div>
    <div class="console">
      <div class="console-head">
        <div class="tabbtn active" data-view="out">Salida</div>
        <div class="tabbtn" data-view="repl">Consola Python</div>
        <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Cargando Python…</span></div>
      </div>
      <div class="out" id="out"></div>
      <div class="replbar hidden" id="replbar">
        <span>&gt;&gt;&gt;</span>
        <input id="repl" placeholder="escribí una expresión y Enter" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
(function(){
'use strict';

const DEMO = `# ¡Bienvenido a PyOS!
# Escribí Python y tocá "Ejecutar" (Ctrl/Cmd + Enter).

def fib(n):
    a, b = 0, 1
    for _ in range(n):
        yield a
        a, b = b, a + b

print("Fibonacci:", list(fib(10)))

nombre = input("¿Cómo te llamás? ")
print(f"Hola, {nombre} 👋")
`;

const STORE = 'pyos.files.v1';
let files = load();
let current = Object.keys(files)[0];

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw){
      const f = JSON.parse(raw);
      if(f && Object.keys(f).length) return f;
    }
  }catch(e){}
  return {'main.py': DEMO};
}
function save(){
  files[current] = cm.getValue();
  try{ localStorage.setItem(STORE, JSON.stringify(files)); }catch(e){}
}

/* ---------- editor ---------- */
const cm = CodeMirror.fromTextArea(document.getElementById('code'), {
  mode:'python', theme:'darcula', lineNumbers:true, indentUnit:4, tabSize:4,
  indentWithTabs:false, autoCloseBrackets:true, styleActiveLine:true, matchBrackets:true,
  extraKeys:{
    'Ctrl-Enter':run, 'Cmd-Enter':run,
    'Ctrl-/':cmv=>cmv.toggleComment(), 'Cmd-/':cmv=>cmv.toggleComment(),
    'Tab':cmv=>cmv.somethingSelected()?cmv.indentSelection('add'):cmv.execCommand('insertSoftTab')
  }
});
cm.setValue(files[current]);
cm.on('change', debounce(save, 400));

function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

/* ---------- archivos y pestañas ---------- */
const fileList = document.getElementById('fileList');
const tabs = document.getElementById('tabs');

function render(){
  fileList.innerHTML = '';
  tabs.innerHTML = '';
  Object.keys(files).forEach(name=>{
    const row = document.createElement('div');
    row.className = 'file' + (name===current?' active':'');
    row.innerHTML = `<span class="py">PY</span><span>${esc(name)}</span><span class="del" title="Eliminar">×</span>`;
    row.onclick = e=>{
      if(e.target.classList.contains('del')) return remove(name);
      open(name);
    };
    fileList.appendChild(row);

    const tab = document.createElement('div');
    tab.className = 'tab' + (name===current?' active':'');
    tab.innerHTML = `<span>${esc(name)}</span><span class="x">×</span>`;
    tab.onclick = e=>{
      if(e.target.classList.contains('x')) return remove(name);
      open(name);
    };
    tabs.appendChild(tab);
  });
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function open(name){
  save();
  current = name;
  cm.setValue(files[name]);
  cm.focus();
  render();
  document.getElementById('sidebar').classList.remove('open');
}
function remove(name){
  if(Object.keys(files).length===1) return log('No podés borrar el único archivo.','err');
  if(!confirm('¿Eliminar '+name+'?')) return;
  delete files[name];
  if(current===name) current = Object.keys(files)[0];
  cm.setValue(files[current]);
  try{ localStorage.setItem(STORE, JSON.stringify(files)); }catch(e){}
  render();
}
document.getElementById('newBtn').onclick = ()=>{
  let name = (prompt('Nombre del archivo:','nuevo.py')||'').trim();
  if(!name) return;
  if(!name.endsWith('.py')) name += '.py';
  if(files[name]) return open(name);
  save();
  files[name] = '';
  current = name;
  cm.setValue('');
  render();
  cm.focus();
};
document.getElementById('menuBtn').onclick = ()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('dlBtn').onclick = ()=>{
  save();
  const blob = new Blob([files[current]],{type:'text/x-python'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = current; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};

/* ---------- consola ---------- */
const out = document.getElementById('out');
function log(text, cls){
  const s = document.createElement('span');
  if(cls) s.className = cls;
  s.textContent = text;
  out.appendChild(s);
  out.scrollTop = out.scrollHeight;
}
document.getElementById('clearBtn').onclick = ()=>{ out.textContent=''; };
document.querySelectorAll('.tabbtn').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const repl = b.dataset.view === 'repl';
    document.getElementById('replbar').classList.toggle('hidden', !repl);
    if(repl) document.getElementById('repl').focus();
  };
});

const dot = document.getElementById('dot');
const statusTxt = document.getElementById('statusTxt');
function status(txt, cls){ statusTxt.textContent = txt; dot.className = 'dot ' + (cls||''); }

/* ---------- runtime ---------- */
let pyodide = null, running = false;
const runBtn = document.getElementById('runBtn');

(async function boot(){
  log('PyOS · iniciando intérprete de Python…\n', 'sys');
  try{
    pyodide = await loadPyodide({ indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
    pyodide.setStdout({ batched: t => log(t + '\n') });
    pyodide.setStderr({ batched: t => log(t + '\n','err') });
    pyodide.globals.set('__pyos_input', prompt_);
    await pyodide.runPythonAsync(`
import builtins
def input(prompt=""):
    if prompt:
        print(prompt, end="")
    v = __pyos_input(prompt)
    print(v)
    return v
builtins.input = input
del input
`);
    const v = pyodide.runPython('import sys; sys.version.split()[0]');
    log('Python ' + v + ' listo.\n\n', 'ok');
    status('Python ' + v, 'ready');
    runBtn.disabled = false;
  }catch(e){
    log('No se pudo cargar el intérprete: ' + e + '\n','err');
    status('Error de carga');
  }
})();

function prompt_(msg){
  const v = window.prompt(String(msg||'Entrada:'));
  return v === null ? '' : v;
}

async function run(){
  if(!pyodide || running) return;
  save();
  running = true;
  runBtn.disabled = true;
  status('Ejecutando…','busy');
  log('\n▶ ' + current + '\n', 'sys');
  const t0 = performance.now();
  try{
    // los otros archivos quedan importables como módulos
    for(const [name, src] of Object.entries(files)){
      if(name !== current) pyodide.FS.writeFile('/home/pyodide/' + name, src);
    }
    await pyodide.loadPackagesFromImports(files[current]);
    await pyodide.runPythonAsync(files[current]);
    log('\n✓ Terminado en ' + Math.round(performance.now()-t0) + ' ms\n','ok');
  }catch(e){
    log('\n' + (e.message || String(e)) + '\n','err');
  }finally{
    running = false;
    runBtn.disabled = false;
    status('Listo','ready');
  }
}
runBtn.onclick = run;

/* ---------- REPL ---------- */
const repl = document.getElementById('repl');
const hist = []; let hi = -1;
repl.addEventListener('keydown', async e=>{
  if(e.key === 'ArrowUp'){ if(hi < hist.length-1){ hi++; repl.value = hist[hist.length-1-hi]; } e.preventDefault(); return; }
  if(e.key === 'ArrowDown'){ if(hi > 0){ hi--; repl.value = hist[hist.length-1-hi]; } else { hi=-1; repl.value=''; } e.preventDefault(); return; }
  if(e.key !== 'Enter') return;
  const src = repl.value;
  if(!src.trim() || !pyodide) return;
  hist.push(src); hi = -1; repl.value = '';
  log('>>> ' + src + '\n','in');
  try{
    await pyodide.loadPackagesFromImports(src);
    const r = await pyodide.runPythonAsync(src);
    if(r !== undefined) log(String(r) + '\n');
  }catch(err){
    log((err.message || String(err)) + '\n','err');
  }
});

render();
})();
</script>
</body>
</html>
